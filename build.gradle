plugins {
    // This version of Minecraft is not obfuscated, so Loom is set up without remapping.
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {

    //put stuff here to make it configure for the java agent project as well

    if (it.name == "java-agent") return
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    repositories {
        maven { url "https://maven.terraformersmc.com/" }
        maven { url 'https://repo.spongepowered.org/repository/maven-public/' }

        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        implementation "io.ably:ably-java:${project.ably_version}"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()
        withJavadocJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }

    tasks.register('combineJars', Jar) {
        archiveFileName = "pets-mod-${project.mod_version}-${project.minecraft_version}-${project.platform}.jar"
        from(zipTree(tasks.named('jar').get().archiveFile))
        from(zipTree(tasks.named('shadowJar').get().archiveFile))
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.named('sourcesJar', Jar) {
        archiveFileName = "pets-mod-${project.mod_version}-${project.minecraft_version}-${project.platform}-${archiveClassifier.get()}.jar"
    }

    tasks.named('javadocJar', Jar) {
        archiveFileName = "pets-mod-${project.mod_version}-${project.minecraft_version}-${project.platform}-${archiveClassifier.get()}.jar"
    }

    tasks.named('build') {
        finalizedBy 'combineJars'
    }
}

tasks.register('buildAll') {
    dependsOn project(":fabric").tasks.named('build')
    dependsOn project(":neoforge").tasks.named('build')
    dependsOn project(":java-agent").tasks.named('build')
}

tasks.register('runAll') {
    dependsOn project(":fabric").tasks.named('runClient')
    dependsOn project(":neoforge").tasks.named('runClient')
    dependsOn project(":java-agent").tasks.named('runClient')
}
