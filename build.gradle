buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

plugins {
    id 'com.github.johnrengelman.shadow' version '4.0.4'
}

apply plugin: 'java'
configurations {
    compile
}

apply plugin: 'net.minecraftforge.gradle.forge'
//Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.

version = project.mod_version + project.build
group = project.maven_group // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = project.mod_id

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    archivesBaseName = "pets-mod"
    version = project.mod_version + "-" + project.minecraft_version + "-forge" + project.build
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"

    // the mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   snapshot are built nightly.
    // stable_#            stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // simply re-run your setup task after changing the mappings to update your workspace.
    mappings = "snapshot_20180921"
    makeObfSourceJar = false
    // The access transformer is auto-detected from src/main/resources/META-INF/accesstransformer.cfg
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    implementation("maven.modrinth:mixinbooter:11.17") {
        transitive = true
    }

   // include "io.ably:ably-java:${project.ably_version}"
    implementation "io.ably:ably-java:${project.ably_version}"
    implementation "com.davidehrmann.vcdiff:vcdiff-core:${project.vcdiff_version}"
    implementation "org.java-websocket:Java-WebSocket:${project.java_websocket_version}"
    implementation "org.msgpack:msgpack-core:${project.msgpack_version}"
   // include "com.davidehrmann.vcdiff:vcdiff-core:${project.vcdiff_version}"
   // include "org.java-websocket:Java-WebSocket:${project.java_websocket_version}"
   // include "org.msgpack:msgpack-core:${project.msgpack_version}"
}

processResources {
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.mod_version + project.build
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        expand 'version': project.mod_version + project.build, 'mcversion': project.minecraft.version
    }

    // copy everything else except the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
                'MixinConfigs': 'pets.client.mixins.json',
                'MixinConnector': 'com.jeff.pets.client.MixinConnector',
                'FMLAT': 'petsmod_at.cfg'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xmaxerrs" << "5000"
}

shadowJar {
    shadowJar.archiveName = "pets-mod-${project.mod_version}-${project.minecraft_version}-forge${project.build}.jar"
    exclude 'module-info.class'
    exclude 'META-INF/versions/**'
    dependencies {
        include(dependency("io.ably:ably-java:${project.ably_version}"))
        include(dependency("com.davidehrmann.vcdiff:vcdiff-core:${project.vcdiff_version}"))
        include(dependency("org.java-websocket:Java-WebSocket:${project.java_websocket_version}"))
        include(dependency("org.msgpack:msgpack-core:${project.msgpack_version}"))
    }
}

reobf {
    shadowJar {

    }
}