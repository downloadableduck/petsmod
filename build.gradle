buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        maven { url "https://maven.shedaniel.me/" }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
        maven {                 url = "https://api.modrinth.com/maven"}
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.24'
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'org.spongepowered.mixin'

mixin {
   add sourceSets.main, 'pets_mod.refmap.json'
    config 'pets.client.mixins.json'
}

configurations {
    shadowLib
}

version = project.version
group = project.maven_group // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'pets-mod'
boolean obfuscate = true

//sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {

    //
    //
    // 4reobf(obfuscate)
    // The mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   Snapshot are built nightly.
    // stable_#            Stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'snapshot', version: '20180921-1.13'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            mods {
                pets_mod {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            mods {
                pets_mod {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'examplemod', '--all', '--output', file('src/generated/resources/')

            mods {
                examplemod {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    //implementation fg.deobf("maven.modrinth:9s6osm5g:dhr1Royh") // cloth config
    implementation("blue.endless:jankson:${rootProject.jankson_version}")
    implementation("com.moandjiezana.toml:toml4j:${rootProject.toml4j_version}")
    //implementation fg.deobf("maven.modrinth:6a16628x:hOGSWOX8")
    //include ("maven.modrinth:6a16628x:hOGSWOX8")

    implementation "maven.modrinth:Rq1qQAvX:rVn7ZhuV"

    // You may put jars on which you depend on in ./libs or you may define them like so..
    // compile "some.group:artifact:version:classifier"
    // compile "some.group:artifact:version"

    // Real examples
    // compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    // compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // The 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    // provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // These dependencies get remapped to your current MCP mappings
    // deobf 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
//jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.spongepowered.org' }
    maven {                 url = "https://api.modrinth.com/maven"}

    flatDir {
        dirs 'mappings'
    }
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    from "src/main/resources"

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar') {
    archiveBaseName = "pets-mod"
    archiveVersion = project.mod_version
    archiveClassifier = project.minecraft_version + "-forge"

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // This is the preferred method to reobfuscate your jar file
}

tasks.register('runClient2', JavaExec) {

    obfuscate = false

    dependsOn mods

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.minecraftforge.userdev.LaunchTesting'

    workingDir = file('run')

    args '--launchTarget', 'fmluserdevclient'
    args '--version', 'forge'
    args '--assetIndex', "${project.minecraft_version}"
    args '--assetsDir', "${gradle.gradleUserHomeDir}/caches/forge_gradle/assets"
    args '--fml.forgeVersion', "${project.forge_version}"
    args '--fml.mcVersion', "${project.minecraft_version}"

    doFirst {
        def classesDir = sourceSets.main.output.classesDirs.asPath
        def resourcesDir = sourceSets.main.output.resourcesDir.absolutePath
        def pathSeparator = System.getProperty("path.separator")

        args '--mods', "pets_mod%%${classesDir}${pathSeparator}${resourcesDir}"

        systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        systemProperty 'forge.logging.console.level', 'debug'

        systemProperty 'net.minecraftforge.gradle.GradleStart.srg.srg-to-mcp', 'official'
    }

    systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
    systemProperty 'forge.logging.console.level', 'debug'
}

tasks.register('mods', Copy) {
    dependsOn 'build'

    from(jar.archiveFile)

    into file("${System.getProperty('user.home')}/AppData/Roaming/.minecraft/developermods/in progress/pets-mod-forge/run/mods")

    doFirst {
        def modsDir = file("${System.getProperty('user.home')}/AppData/Roaming/.minecraft/developermods/in progress/pets-mod-forge/run/mods")
        if (modsDir.exists()) {
            modsDir.listFiles().each { file ->
                if (file.name.startsWith("pets-mod") && file.name.endsWith(".jar")) {
                    file.delete()
                }
            }
        }
    }
}

jar {
    manifest {
        attributes([
                'FMLCorePluginContainsFMLMod': 'true',
                'ForceLoadAsMod': 'true',
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
                "MixinConfigs": "pets.client.mixins.json",
                'MixinConnector': 'com.jeff.pets.client.MixinConnector'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xmaxerrs" << "5000"
}

tasks.build.dependsOn tasks.shadowJar

shadowJar {
    configurations = [project.configurations.shadowLib]

    mergeServiceFiles()

    exclude 'META-INF/maven/**'
    exclude 'LICENSE.txt'

    archiveClassifier.set('')
}