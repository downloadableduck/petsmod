buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven {
            name = "forge"
            url = "https://files.minecraftforge.net/maven"
        }
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
        maven {
            name = 'liteloader'
            url = 'https://repo.mumfrey.com/content/repositories/releases/'
        }
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'minecraft'
            url = 'https://libraries.minecraft.net/'
        }
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = "gtnh"
            url = "https://nexus.gtnewhorizons.com/repository/releases/"
        }
        maven {
            name = "forge-legacy"
            url = "https://maven.minecraftforge.net/releases/"
        }
        maven {
            name = "cleanroom"
            url = "https://maven.cleanroommc.com"
        }

        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.0.12'
    }
}

configurations {
    compile
}

apply plugin: 'forge'
apply plugin: 'liteloader'
apply plugin: 'idea'

group = "com.jeff.pets" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = "pets-mod"

dependencies {
    compile 'org.ow2.asm:asm-debug-all:5.2'
}

idea {
    module {
        inheritOutputDirs = true
    }
}

minecraft {
    //accessTransformers.add(file('src/main/resources/META-INF/accesstransformer.cfg'))
    // these values are defined in the gradle.properties file, so that this file does not need to be altered
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"

    liteloader {
        buildDir = "libs"
    }
}

tasks.withType(JavaCompile).configureEach {task ->
    options.compilerArgs << "-Xmaxerrs" << "10000"
}

jar {
    // The litemod task above generates the litemod.json dynamically, you can replace it with a resource if you want more control
    archiveName = "pets-mod-" + project.version + "-" + project.mcVersion + "-lite" + project.build + ".litemod"
    archivesBaseName = "pets-mod"
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8;
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(Jar) {
    archiveName = "pets-mod-${project.version}-${project.mcVersion}-lite${project.build}.litemod"
}