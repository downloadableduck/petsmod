tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xmaxerrs" << "5000"
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.objectweb.asm', 'com.jeff.pets.libs.asm'
    relocate 'org.objectweb.asm.commons', 'com.jeff.pets.libs.asm.common'
    relocate 'org.objectweb.asm.tree', 'com.jeff.pets.libs.asm.tree'
    relocate 'blue.endless.jankson', 'com.jeff.pets.libs.jankson'
    relocate 'com.moandjiezana.toml', 'com.jeff.pets.libs.toml'
    relocate 'me.shedaniel.cloth.basic-math', 'com.jeff.pets.libs.cloth-basic-math'
    relocate 'com.google.errorprone.annotations', 'com.jeff.pets.libs.errorprone.annotations'

    manifest {
        attributes(
                'Premain-Class': 'com.jeff.pets.Agent',
                'Agent-Class': 'com.jeff.pets.PetsInitializer',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}

tasks.register('runClient', JavaExec) {

    dependsOn mods

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.minecraft.client.main.Main'

    workingDir = file('run')

    jvmArgs "-javaagent:${tasks.shadowJar.archiveFile.get().asFile.absolutePath}"
    System.out.println("-javaagent:${tasks.shadowJar.archiveFile.get().asFile.absolutePath}")

    doFirst {
        def classesDir = sourceSets.main.output.classesDirs.asPath
        def resourcesDir = sourceSets.main.output.resourcesDir.absolutePath
        def pathSeparator = System.getProperty("path.separator")

        args '--mods', "pets_mod%%${classesDir}${pathSeparator}${resourcesDir}"

        args '--version', '26.1'
        args '--accessToken', '0'
        args '--assetsDir', file('run/assets').absolutePath

        systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        systemProperty 'forge.logging.console.level', 'debug'

        systemProperty 'net.minecraftforge.gradle.GradleStart.srg.srg-to-mcp', 'official'
    }

    systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
    systemProperty 'forge.logging.console.level', 'debug'
}

tasks.register('mods', Copy) {
    dependsOn 'build'

    from(jar.archiveFile)

    into file("${System.getProperty('user.home')}/AppData/Roaming/.minecraft/developermods/in progress/petsmod-java-agent/run/mods")

    doFirst {
        def modsDir = file("${System.getProperty('user.home')}/AppData/Roaming/.minecraft/developermods/in progress/petsmod-java-agent/run/mods")
        if (modsDir.exists()) {
            modsDir.listFiles().each { file ->
                if (file.name.startsWith("pets-mod") && file.name.endsWith(".jar")) {
                    file.delete()
                }
            }
        }
    }
}

tasks.withType(Jar).configureEach {
    archiveVersion = ''
}