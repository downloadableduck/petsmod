plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
    id "legacy-looming" version "${loom_version}" // Version must be the same as fabric-loom's
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
    version = project.mod_version + "-" + project.minecraft_version + "-legacy-fabric" + project.build
}

repositories {
    // Legacy Fabric publishes broken yarn mappings for 1.7.10 (they contain modern
    // 1.20.x names), so the corrected mappings are served from a local repository
    // and pinned here with exclusiveContent, which wins regardless of ordering.
    /*exclusiveContent {
        forRepository {
            maven {
                name = "LocalCorrectedYarn"
                url = uri("local-maven")
            }
        }
        filter {
            includeModule("net.legacyfabric", "yarn")
        }
    }*/
    maven {
        name = "OrnitheMC"
        url = "https://maven.ornithemc.net/releases/"
    }
    maven {
        name = "OrnitheMC"
        url = "https://maven.ornithemc.net/snapshots/"
    }
    maven {url "https://maven.shedaniel.me/"}
    maven {    url "https://repo.legacyfabric.net/legacyfabric"}
    maven {
        url = uri("${projectDir}/local-maven")
    }
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

loom {
    accessWidenerPath = file('src/main/resources/pets.accessWidener')

    runs {
        client {
            // 1.7.x requires a user properties file to be present on the classpath
            programArgs "--userProperties", "{}"
        }
    }
}

legacyLooming {
    // 	The generation of intermediary to use, default is 1.
    // 	legacy.yarn() will automatically point at the variant for the set intermediary generation.
    // 	However do not forget to set the right build number of legacy yarn as they are different per variant.
    //	intermediaryVersion = 2

    // 	Wether to use Legacy Fabric intermediaries or Upstream/Official FabricMC ones.
    //	Default to true: use Legacy Fabric intermediaries.
    // 	If setting to false, don't forget to also set intermediaryVersion to generation 2.
    //	useLFIntermediary.set(false)
}

def var = dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings(legacy.yarn(project.minecraft_version, project.yarn_build))

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "me.shedaniel.cloth:basic-math:0.6.1"
    include "me.shedaniel.cloth:basic-math:0.6.1"
    implementation("blue.endless:jankson:${rootProject.jankson_version}")
    implementation("com.moandjiezana.toml:toml4j:${rootProject.toml4j_version}")

    // 1.7.10 ships Gson on the classpath only through its own libraries, so make it
    // explicit for the config serializers.
    implementation("com.google.code.gson:gson:2.8.9")
}
var

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version + project.build
    }
}

tasks.withType(JavaCompile).configureEach {
    // Ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    it.options.encoding = "UTF-8"

    if (JavaVersion.current().isJava9Compatible()) {
        it.options.release = 8
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xmaxerrs" << "10000"
}