plugins {
    id 'dev.architectury.loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = "pets-mod"
}

loom {
    silentMojangMappingsLicense()
    accessWidenerPath = file('src/main/resources/META-INF/pets.accesswidener')

    forge {
        accessTransformer('src/main/resources/META-INF/accesstransformer.cfg')
        //mixinConfig 'src/main/resources/pets.client.mixins.json'
    }
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven {url = 'https://maven.parchmentmc.org'}

    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    minecraft "net.minecraft:minecraft:$project.minecraft_version"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:$project.minecraft_version-$project.forge_version"
    modImplementation "me.shedaniel.cloth:cloth-config-forge:${project.cloth_config_version}"
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    //withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
}

// Configure Maven publishing.
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
// Example for how to get properties into the manifest for reading at runtime.
tasks.named('remapJar') {
    archiveBaseName = "pets-mod"
    archiveVersion = project.version
    archiveClassifier = project.minecraft_version + "-forge"

    // This is the preferred method to reobfuscate your jar file
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release = 8
}
tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    from "src/main/resources"

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}