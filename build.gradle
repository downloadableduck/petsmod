buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.15-SNAPSHOT'
    }
}
plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'java'
}

base {
    archivesName = "pets-mod-${project.mod_version}-${project.minecraft_version}-bta";
}

group project.maven_group
version ""

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://jitpack.io' }
    ivy {
        url = 'https://piston-data.mojang.com'
        patternLayout {
            artifact 'v1/[organisation]/[revision]/[module].jar'
        }
        metadataSources {
            artifact()
        }
    }
    maven{ url = "https://maven.fabricmc.net/" }
    maven{ url = "https://maven.danygames2014.net/signalum"}
    maven{ url = "https://maven.thesignalumproject.net/infrastructure"}
    maven{ url = "https://maven.thesignalumproject.net/releases" }
    maven{ url = "https://maven.thesignalumproject.net/nightly" }
    maven {url = "https://maven.glass-launcher.net/releases/"}
}

loom {
    def btaChannel = libs.versions.btaChannel.get()
    def btaVersion = "v" + libs.versions.bta.get()
    customMinecraftMetadata.set("https://downloads.betterthanadventure.net/bta-client/${btaChannel}/$btaVersion/manifest.json")
}

dependencies {
    minecraft("::${libs.versions.bta.get()}")
    implementation(libs.loader)
    implementation(libs.modMenu)
    compileOnly 'org.jetbrains:annotations:24.1.0'
    implementation 'com.google.guava:guava:33.0.0-jre'
    implementation 'com.google.code.gson:gson:2.10.1'
    include 'com.google.guava:guava:33.0.0-jre'
    implementation 'blue.endless:jankson:1.2.3'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'org.joml:joml:1.10.5'
    implementation ('it.unimi.dsi:fastutil:8.5.19')
    runtimeClasspath(libs.clientJar)
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '5000', '-Xmaxwarns', '1000'])
}

tasks.matching { it.name == 'extractNatives' }.configureEach {
    doLast {
        def nativesDir = file(".gradle/loom-cache/natives/8.0.1")
        if (!nativesDir.exists()) return
        def cacheRoot = new File(System.getProperty('user.home'), '.gradle/caches/modules-2/files-2.1/org.lwjgl')
        def patterns = [
            'lwjgl/3.3.3/*/lwjgl-3.3.3-natives-linux.jar',
            'lwjgl-glfw/3.3.3/*/lwjgl-glfw-3.3.3-natives-linux.jar',
            'lwjgl-openal/3.3.3/*/lwjgl-openal-3.3.3-natives-linux.jar',
            'lwjgl-opengl/3.3.3/*/lwjgl-opengl-3.3.3-natives-linux.jar',
            'lwjgl-stb/3.3.3/*/lwjgl-stb-3.3.3-natives-linux.jar',
        ]
        def jars = patterns.collectMany { p ->
            fileTree(cacheRoot).matching { include p }.files as List
        }
        if (jars.isEmpty()) {
            logger.warn("LWJGL 3.3.3 Linux native jars not found in Gradle cache; natives not replaced.")
            return
        }
        nativesDir.listFiles()?.each { if (it.isFile()) it.delete() }
        def tmp = new File(nativesDir, '_tmp_extract')
        tmp.mkdirs()
        jars.each { jarFile ->
            copy {
                from zipTree(jarFile)
                into tmp
                include '**/*.so'
            }
        }
        fileTree(tmp).matching { include '**/*.so' }.files.each { f ->
            copy { from f; into nativesDir }
        }
        tmp.deleteDir()
    }
}