import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
    id "com.vanniktech.maven.publish" version "0.28.0"
    id 'signing'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name + "-" + project.mod_version + "-" + project.minecraft_version  + "+" + project.build
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url = "https://maven.quiltmc.org/repository/release"}
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

loom {
    //splitEnvironmentSourceSets()

    accessWidenerPath = file("src/main/resources/pets.accessWidener")

    mods {
        "pets-mod" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_version}"
    modApi "net.fabricmc:fabric-loader:${project.loader_version}"
    modApi "maven.modrinth:9s6osm5g:vcrZcwvb"
    modImplementation files(files('libs/fabric-api.jar'))
    //modApi("maven.modrinth:mOgUt4GM:${project.modmenu_version}") //modmenu
    implementation("blue.endless:jankson:${rootProject.jankson_version}")
    implementation("com.moandjiezana.toml:toml4j:${rootProject.toml4j_version}")
    modImplementation "me.shedaniel.cloth:basic-math:0.6.1"
    //include "me.shedaniel:cloth-basic-math:0.6.1"
    //modApi "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    //modApi "maven.modrinth:yacl:${project.yacl_version}"
   // modImplementation "org.quiltmc.parsers:gson:0.2.1"
    //modImplementation "org.quiltmc.parsers:json:0.2.1"
}

processResources {
    inputs.property "version", project.version + "+" + project.build

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
    withJavadocJar()

    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from sourceSets.main.allSource

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
    tasks.withType(AbstractCopyTask).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

// configure the maven publication
mavenPublishing {
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()
    coordinates("io.github.downloadableduck", "petsmod", "0.8.1")
    pom {
        name = "Pets Mod"
        description = "Adds client-sided pets into your game"
        url = "https://github.com/downloadableduck/petsmod"
        licenses {
            license {
                name = "MIT"
                url = "https://opensource.org/licenses/MIT"
            }
        }
        developers {
            developer {
                id = "jeff"
                name = "Jeff"
            }
        }
        scm {
            connection = "scm:git:git://github.com/downloadableduck/petsmod.git"
            developerConnection = "scm:git:ssh://github.com:downloadableduck/petsmod.git"
            url = "https://github.com/downloadableduck/petsmod"
        }
    }
}

