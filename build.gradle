plugins {
    id("fabric-loom") version "1.17.20"
    id("babric-loom-extension") version "1.17.5"
    id 'maven-publish'
}

version = "${project.mod_version}-${project.minecraft_version}-babric${project.build}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    customMinecraftManifest.set("https://babric.github.io/manifest-polyfill/${minecraft_version}.json")
    intermediaryUrl.set("https://maven.glass-launcher.net/babric/babric/intermediary/%1\$s/intermediary-%1\$s-v2.jar")
    accessWidenerPath = file("src/main/resources/pets.accessWidener")
    //sharedCwJar = true
}

repositories {
    mavenCentral()
    maven { url ="https://maven.glass-launcher.net/snapshots/" }
    maven { url ="https://maven.glass-launcher.net/releases/" }
    maven { url ="https://maven.glass-launcher.net/babric" }
    maven { url ="https://maven.minecraftforge.net/" }
    maven { url ="https://jitpack.io/" }
    maven { url ="https://maven.fabricmc.net/" }
    maven { url = "https://maven.glass-launcher.net/babric" }
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url ="https://api.modrinth.com/maven" }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
    maven {
        name = 'Babric'
        url = 'https://maven.glass-launcher.net/babric'
    }
    maven { url "https://maven.glass-launcher.net/releases" }
    maven { url "https://maven.ornithemc.net/releases/" }
}

configurations.configureEach {
    exclude group: "org.ow2.asm", module: "asm-all"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.glasslauncher:biny:b1.7.3+e0778a3:v2"
    modImplementation "babric:fabric-loader:${project.loader_version}"

    implementation "org.slf4j:slf4j-api:1.8.0-beta4"
    implementation "org.apache.logging.log4j:log4j-slf4j18-impl:2.16.0"

    compileOnly "org.jetbrains:annotations:24.1.0"
    implementation "blue.endless:jankson:${project.jankson_version}"
    implementation "com.moandjiezana.toml:toml4j:${project.toml4j_version}"
    modImplementation "maven.modrinth:472oW63Q:YsQonigP"
    modImplementation("net.modificationstation:StationAPI:${project.stationapi_version}")
    modImplementation("net.danygames2014:modmenu:${project.modmenu_version}")

    // Dependencies required by bundled/decompiled Cloth Config, AutoConfig, and math utilities.
    implementation "com.google.guava:guava:21.0"
    implementation "org.apache.commons:commons-lang3:3.5"
    implementation "commons-io:commons-io:2.5"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.findProperty('archives_base_name') ?: project.name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xmaxerrs" << "5000"
}


tasks.named('jar') {
    archiveBaseName = project.archives_base_name
    archiveVersion = project.mod_version
    archiveClassifier = project.minecraft_version
}
