plugins {
    id 'java'
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
    id "com.vanniktech.maven.publish" version "0.28.0"
    id 'org.spongepowered.gradle.vanilla' version '0.3.2'
    id 'signing'
    id 'com.gradleup.shadow' version '9.6.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name + "-" + project.mod_version + "-" + project.minecraft_version + "-java-agent"
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://api.modrinth.com/maven"}
    maven {url 'https://repo.spongepowered.org/repository/maven-public/'}
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    implementation 'org.ow2.asm:asm:9.10'
    implementation 'org.ow2.asm:asm-commons:9.10'
    implementation 'org.ow2.asm:asm-tree:9.10'
    implementation 'me.shedaniel.cloth:basic-math:0.6.1'
    implementation("blue.endless:jankson:${rootProject.jankson_version}")
    implementation("com.moandjiezana.toml:toml4j:${rootProject.toml4j_version}")
    implementation 'io.ably:ably-java:1.2.40'
    implementation 'io.ably:ably-java:1.2.40'
    implementation 'com.davidehrmann.vcdiff:vcdiff-core:0.1.1'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    implementation 'org.msgpack:msgpack-core:0.9.8'
}

minecraft {
    version(project.minecraft_version)
}
processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version + "+" + project.build
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
    withJavadocJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from sourceSets.main.allSource

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
    tasks.withType(AbstractCopyTask).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

