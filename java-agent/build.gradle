plugins {
    id 'java'
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
    id "com.vanniktech.maven.publish" version "0.28.0"
    id 'org.spongepowered.gradle.vanilla' version '0.3.2'
    id 'signing'
    id 'com.gradleup.shadow' version '9.6.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name + "-" + project.mod_version + "-" + project.minecraft_version + "-java-agent"
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://api.modrinth.com/maven" }
    maven {
        url 'https://repo.sleeping.town'
        content {
            includeGroup 'com.unascribed'
        }
    }
}

dependencies {
    compileOnly 'com.unascribed:nilloader:1.4.0'
    implementation 'org.ow2.asm:asm:9.10'
    implementation 'org.ow2.asm:asm-commons:9.10'
    implementation 'org.ow2.asm:asm-tree:9.10'
    implementation("blue.endless:jankson:${rootProject.jankson_version}")
    implementation("com.moandjiezana.toml:toml4j:${rootProject.toml4j_version}")
    implementation "io.ably:ably-java:${project.ably_version}"
    implementation "io.ably:ably-java:${project.ably_version}"
    implementation 'com.davidehrmann.vcdiff:vcdiff-core:0.1.1'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    implementation "org.msgpack:msgpack-core:${project.msgpack_version}"
    implementation project(":common")
}

minecraft {
    version(project.minecraft_version)
}
processResources {
    inputs.property "version", project.version

    filesMatching("pets-mod.nilmod.css") {
        expand "version": inputs.properties.version + "+" + project.build
    }
    filesMatching("com.jeff.pets.client.autoupdate.AutoUpdater") {
        expand "version": inputs.properties.version + "+" + project.build
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    withJavadocJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from sourceSets.main.allSource

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
    tasks.withType(AbstractCopyTask).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xmaxerrs" << "5000"
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.objectweb.asm', 'com.jeff.pets.libs.asm'
    relocate 'org.objectweb.asm.commons', 'com.jeff.pets.libs.asm.common'
    relocate 'org.objectweb.asm.tree', 'com.jeff.pets.libs.asm.tree'
    relocate 'blue.endless.jankson', 'com.jeff.pets.libs.jankson'
    relocate 'com.moandjiezana.toml', 'com.jeff.pets.libs.toml'
    relocate 'com.google.errorprone.annotations', 'com.jeff.pets.libs.errorprone.annotations'
    relocate 'com.davidehrmann.vcdiff', 'com.jeff.pets.libs.vcdiff'
    relocate 'io.ably', 'com.jeff.pets.libs.ably'
    relocate 'org.java_websocket', 'com.jeff.pets.libs.java_websocket'
    relocate 'org.msgpack', 'com.jeff.pets.libs.msgpack'

    manifest {
        attributes(
                'Premain-Class': 'com.jeff.pets.javaagent.Agent',
                'Agent-Class': 'com.jeff.pets.javaagent.PetsModJavaAgentInit',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true',
                'Implementation-Version': project.version + project.build
        )
    }
}

tasks.register('runClient', JavaExec) {

    dependsOn mods

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.minecraft.client.main.Main'

    workingDir = file('run')

    jvmArgs "-javaagent:${tasks.shadowJar.archiveFile.get().asFile.absolutePath}"
    System.out.println("-javaagent:${tasks.shadowJar.archiveFile.get().asFile.absolutePath}")

    doFirst {
        def classesDir = sourceSets.main.output.classesDirs.asPath
        def resourcesDir = sourceSets.main.output.resourcesDir.absolutePath
        def pathSeparator = System.getProperty("path.separator")

        args '--mods', "pets_mod%%${classesDir}${pathSeparator}${resourcesDir}"

        args '--version', '26.2'
        args '--accessToken', '0'
        args '--assetsDir', file('run/assets').absolutePath

        systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        systemProperty 'forge.logging.console.level', 'debug'

        systemProperty 'net.minecraftforge.gradle.GradleStart.srg.srg-to-mcp', 'official'
    }

    systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
    systemProperty 'forge.logging.console.level', 'debug'
}

tasks.register('mods', Copy) {
    dependsOn 'build'

    from(jar.archiveFile)

    into file("${System.getProperty('user.home')}/AppData/Roaming/.minecraft/developermods/in progress/petsmod/java-agent/run/mods")

    doFirst {
        def modsDir = file("${System.getProperty('user.home')}/AppData/Roaming/.minecraft/developermods/in progress/petsmod/java-agent/run/mods")
        if (modsDir.exists()) {
            modsDir.listFiles().each { file ->
                if (file.name.startsWith("pets-mod") && file.name.endsWith(".jar")) {
                    file.delete()
                }
            }
        }
    }
}

tasks.withType(Jar).configureEach {
    archiveVersion = ''
}