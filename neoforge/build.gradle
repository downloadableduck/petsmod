import java.nio.file.FileSystems
import java.nio.file.Files

plugins {
    id 'com.gradleup.shadow'
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.neoforged.net/releases" }
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "shadow"
}

tasks.named('shadowJar') {
    dependsOn 'jar'
    setZip64(true)
}

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

version = mod_version
group = maven_group

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    include "com.davidehrmann.vcdiff:vcdiff-core:${project.vcdiff_version}"
    include "org.java-websocket:Java-WebSocket:${project.java_websocket_version}"
    include "org.msgpack:msgpack-core:${project.msgpack_version}"
    include "io.ably:ably-java:${project.ably_version}"
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

java {
    withSourcesJar()
    withJavadocJar()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

loom {
    mods {
        "pets_mod" {
            sourceSet sourceSets.main
        }
        "pets_mod_test" {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        testMod {
            inherit client
            sourceSet = sourceSets.main.name
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neoforge_version,
            mod_id           : "pets_mod",
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version + project.build
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/resources"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(Javadoc).configureEach {
    failOnError = false
}

tasks.named('jar') {
    dependsOn 'generateModMetadata'
    exclude 'ably.mod.toml'
    exclude 'msgpack.mod.toml'
    exclude 'vcdiff.mod.toml'
    exclude 'websocket.mod.toml'
    exclude 'assets/pets_mod/ably.png'
    exclude 'assets/pets_mod/msgpack.png'
    exclude 'assets/pets_mod/vcdiff.png'
    exclude 'assets/pets_mod/websocket.png'
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(Jar) {
    File srcDir = project.sourceSets.main.resources.srcDirs.find { (it.name == "resources") }
    File iconFile = project(":common").sourceSets.main.resources.srcDirs.find { (it.name == "resources") }
    def ably = project.ably_version
    def msgpack = project.msgpack_version
    def vcdiff = project.vcdiff_version
    def websocket = project.java_websocket_version
    doLast { ->
        java.nio.file.Path jar = archiveFile.get().asFile.toPath()
        Static.move("ably.mod.toml", "ably-java-${ably}.jar", jar, srcDir, "ably.png", iconFile)
        Static.move("msgpack.mod.toml", "msgpack-core-${msgpack}.jar", jar, srcDir, "msgpack.png", iconFile)
        Static.move("vcdiff.mod.toml", "vcdiff-core-${vcdiff}.jar", jar, srcDir, "vcdiff.png", iconFile)
        Static.move("websocket.mod.toml", "Java-WebSocket-${websocket}.jar", jar, srcDir, "websocket.png", iconFile)
    }
}

class Static {
    static def move(String json, String jarName, java.nio.file.Path jar, File srcDir, String icon, File iconDir) {

        File ablyJson = srcDir.toPath().resolve(json).toFile()
        File iconFile = iconDir.toPath().resolve("assets").resolve("pets-mod").resolve(icon).toFile()

        FileSystems.newFileSystem(jar, (ClassLoader) null).withCloseable { outerFs ->
            java.nio.file.Path jarPath = outerFs.getPath("META-INF", "jars", jarName)

            if (Files.exists(jarPath)) {
                FileSystems.newFileSystem(jarPath, (ClassLoader) null).withCloseable { innerFs ->
                    java.nio.file.Path metaInf = innerFs.getPath("META-INF")
                    java.nio.file.Path jsonPath = metaInf.resolve("neoforge.mods.toml")
                    java.nio.file.Path iconDest = innerFs.getPath(icon)

                    Files.deleteIfExists(jsonPath)
                    Files.copy(ablyJson.toPath(), jsonPath)
                    try {
                        Files.copy(iconFile.toPath(), iconDest)
                    } catch (Exception ignored) {
                    }
                }
            }
        }
    }
}